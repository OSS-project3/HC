name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/honor-citizen

    env:
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      NAVER_CLIENT_ID: test-naver-client-id
      NAVER_CLIENT_SECRET: test-naver-client-secret
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtbG9uZy1lbm91Z2g=
      AWS_ACCESS_KEY: test-access-key
      AWS_SECRET_KEY: test-secret-key
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET: test-bucket
      AWS_S3_BASE_URL: https://test-bucket.s3.ap-northeast-2.amazonaws.com
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password
      MAIL_FROM: test@example.com
      APP_FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon

      - name: Build backend
        run: ./gradlew bootJar --no-daemon

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
