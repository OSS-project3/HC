spring.application.name=honor-citizen

# JPA schema init (schema.sql runs after Hibernate ddl-auto)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Unpaid applications are checked every 10 minutes by default; override per environment when needed.
application.payment-timeout-scheduler.cron=0 */10 * * * *

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 Naver Registration
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.provider=naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,birthyear,birthday
spring.security.oauth2.client.registration.naver.client-name=Naver

# OAuth2 Naver Provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:honor-citizen}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=1209600000

# Email verification code HMAC secret — JWT 서명키와 용도가 달라 별도로 분리한다(키 재사용 지양).
app.auth.email-code-secret=${EMAIL_CODE_SECRET}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# Auth Cookie
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# Frontend
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# AWS S3
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.s3.region=${AWS_REGION}
cloud.aws.s3.base-url=${AWS_S3_BASE_URL}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CitizenCard
app.card.template-key=${CARD_TEMPLATE_KEY:templates/citizen-card-template.png}
app.card.zodiac-key-prefix=${CARD_ZODIAC_PREFIX:templates/zodiac}
app.card.issuer-name=${CARD_ISSUER_NAME:전북특별자치도 전주시}

# TossPayments
app.toss.base-url=https://api.tosspayments.com
app.toss.secret-key=${TOSS_SECRET_KEY:test_sk_placeholder}
app.toss.webhook-secret=${TOSS_WEBHOOK_SECRET:}
app.toss.default-bank=${TOSS_DEFAULT_BANK:하나}

# Payment Amounts
app.payment.service-amount=${PAYMENT_SERVICE_AMOUNT:30000}
app.payment.shipping-fee=${PAYMENT_SHIPPING_FEE:25000}

# Mail (SMTP) — host/port/from은 로컬 기본값을 두어 설정이 없어도 기동은 되도록 하고,
# 계정·비밀번호는 AWS/OAuth 시크릿과 동일하게 기본값 없이 환경변수로만 받는다(하드코딩 금지).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@honor-citizen.local}
