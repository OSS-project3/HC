server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 백엔드 spring.servlet.multipart.max-request-size(application.properties)와 동일하게 맞춘다 —
  # nginx 기본값(1m)이 더 작아서 신청서(로고/직인 이미지 + 엑셀 zip)가 413으로 막히던 문제.
  client_max_body_size 10m;

  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /oauth2/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /login/oauth2/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
