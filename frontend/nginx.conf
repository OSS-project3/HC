# 호스트 nginx(TLS 종료)가 이미 보낸 X-Forwarded-Proto가 있으면 그대로 쓰고,
# 없을 때만 이 컨테이너 자체의 접속 스킴($scheme, 내부적으로는 항상 http)으로 대체한다.
# 그냥 $scheme로 덮어쓰면 https로 들어온 요청도 backend에는 http로 전달돼
# Spring Security의 OAuth2 redirect_uri가 http://로 생성되는 문제가 생긴다.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
  location /oauth2/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
  location /login/oauth2/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
  location / { try_files $uri $uri/ /index.html; }
}
